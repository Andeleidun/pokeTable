name: CI

on:
  push:
    branches: [main, modernize/frontend-quality-2026]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from package manifest
        # The current lockfile predates this modernization and is internally
        # inconsistent after a Dependabot transitive update. Validate the app
        # from package.json until lockfile/toolchain repair is isolated.
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
